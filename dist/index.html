<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Centre for Transformation | Spiritual Growth, Consciousness & Self-Discovery</title>
    <meta
      name="description"
      content="Discover expert teachings and guided self-growth that blend timeless wisdom with spirituality & science, from beginner concepts to advanced consciousness work, led by Zalah."
    />
    <link rel="icon" type="image/png" href="/images/logo/logo-color.png" />
    <meta name="theme-color" content="#1a1033" />
    <meta property="og:title" content="The Centre for Transformation" />
    <meta
      property="og:description"
      content="Spiritual growth, consciousness and self-discovery programs led by Zalah, practical wisdom for a kinder world."
    />
    <!-- Social crawlers resolve og:image against their own request, not against
         this document, so it has to be a full url rather than a site path. -->
    <meta property="og:image" content="https://thecft.ca/images/site/zalah-facilitator.jpg" />
    <!-- The three faces the first screen is drawn in, and nothing else. They are
         served from this origin now (see src/styles/fonts.css), so the two
         preconnects and the render-blocking Google stylesheet they replaced are
         gone. Preloading them is what keeps the swap from moving the layout:
         they are in hand before the hero text is laid out. Caveat, used for one
         handwritten accent further down the page, is deliberately not preloaded. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/manrope-normal-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/cormorant-garamond-normal-latin.woff2" />
    <!-- The first hero slide is the largest thing above the fold, so it is the
         LCP. The two rules below are the same two the slide itself offers, split
         on the same 1000px break: below it the slide shows a window of the full
         resolution picture, above it the usual width candidates. -->
    <link
      rel="preload"
      as="image"
      href="/images/site/hero-bg-guidance.webp"
      media="(max-width: 1000px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      media="(min-width: 1001px)"
      imagesrcset="/images/site/hero-bg-guidance-900.webp 900w, /images/site/hero-bg-guidance.webp 1824w"
      imagesizes="100vw"
    />
    <script type="module" crossorigin src="/assets/index-Dy_FIESy.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/react-bk-HWSwV.js">
    <link rel="stylesheet" crossorigin href="/assets/index-ChfjOIjP.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
