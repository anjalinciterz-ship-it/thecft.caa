# Netlify builds the SPA from source and publishes Vite's dist output. The API
# origin is NOT baked here: VITE_API_BASE is set in the Netlify dashboard
# (Site settings → Environment variables) to the Render URL, so the same commit
# works whether the API lives on the same host or on Render.
#
# The audiobooks ride inside the bundle: `npm run build` copies the tracked
# repo-root media folder into dist, so Netlify serves the 18 recordings itself as
# static files with byte ranges. No CDN origin and no environment variable is
# needed for book audio.
[build]
  command = "npm run build"
  publish = "dist"

# public/_redirects already ships the SPA fallback, so deep links like
# /dashboard/courses resolve to index.html instead of a 404. This block mirrors
# it so the rule also holds if the file ever moves. Rules are matched top to
# bottom and the first match wins, so the media rule has to sit above the
# catch-all: it is what stops a missing recording from being answered with the
# app document, which is the failure that poisoned visitors' caches in November.
[[redirects]]
  from = "/media/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify matches a real file in publish/ before it applies a 200 rewrite, so
# /robots.txt and /sitemap.xml are served as themselves, not as index.html. These
# rules only pin down the content type, which is what makes a crawler accept them.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Vite names every script and stylesheet with its content hash, so a change to
# one file can never be served from another file's cache entry. One year, and
# immutable so the browser skips the revalidation request entirely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images keep their names between deploys, so they get a short life instead of a
# permanent one: replacing a file in place still reaches visitors within a day.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The document itself must never be cached, or a deploy would keep handing
# visitors the old index.html and the old hashed asset names with it.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The audiobook recordings, published by the build. Range requests are served by
# Netlify's own static file handler, which is what makes scrubbing work.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
